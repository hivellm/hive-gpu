name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        rust: [stable, nightly]
        include:
          - os: macos-latest
            features: metal-native
          - os: ubuntu-latest
            features: cuda
          - os: windows-latest
            features: wgpu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v3
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          xcode-select --install || true
          # Install Metal development tools
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
          # Install CUDA if needed
          if [ "${{ matrix.features }}" = "cuda" ]; then
            wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2004/x86_64/cuda-ubuntu2004.pin
            sudo mv cuda-ubuntu2004.pin /etc/apt/preferences.d/cuda-repository-pin-600
            wget https://developer.download.nvidia.com/compute/cuda/12.0.0/local_installers/cuda-repo-ubuntu2004-12-0-local_12.0.0-525.60.13-1_amd64.deb
            sudo dpkg -i cuda-repo-ubuntu2004-12-0-local_12.0.0-525.60.13-1_amd64.deb
            sudo cp /var/cuda-repo-ubuntu2004-12-0-local/cuda-*-keyring.gpg /usr/share/keyrings/
            sudo apt-get update
            sudo apt-get -y install cuda
          fi

      - name: Install Windows dependencies
        if: matrix.os == 'windows-latest'
        run: |
          # Install Visual Studio Build Tools
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools"
          # Install CUDA if needed
          if [ "${{ matrix.features }}" = "cuda" ]; then
            choco install cuda
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build (Metal)
        if: matrix.os == 'macos-latest'
        run: cargo build --features metal-native --verbose

      - name: Build (CUDA)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'cuda'
        run: cargo build --features cuda --verbose

      - name: Build (wgpu)
        if: matrix.os == 'windows-latest' && matrix.features == 'wgpu'
        run: cargo build --features wgpu --verbose

      - name: Build (default)
        if: matrix.features == 'metal-native'
        run: cargo build --verbose

      - name: Test (Metal)
        if: matrix.os == 'macos-latest'
        run: cargo test --features metal-native --verbose

      - name: Test (CUDA)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'cuda'
        run: cargo test --features cuda --verbose

      - name: Test (wgpu)
        if: matrix.os == 'windows-latest' && matrix.features == 'wgpu'
        run: cargo test --features wgpu --verbose

      - name: Test (default)
        if: matrix.features == 'metal-native'
        run: cargo test --verbose

      - name: Run examples (Metal)
        if: matrix.os == 'macos-latest'
        run: cargo run --example metal_basic --features metal-native

      - name: Run examples (CUDA)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'cuda'
        run: cargo run --example cuda_basic --features cuda

      - name: Run examples (wgpu)
        if: matrix.os == 'windows-latest' && matrix.features == 'wgpu'
        run: cargo run --example wgpu_basic --features wgpu

      - name: Run benchmarks (Metal)
        if: matrix.os == 'macos-latest'
        run: cargo bench --features metal-native --verbose

      - name: Run benchmarks (CUDA)
        if: matrix.os == 'ubuntu-latest' && matrix.features == 'cuda'
        run: cargo bench --features cuda --verbose

      - name: Run benchmarks (wgpu)
        if: matrix.os == 'windows-latest' && matrix.features == 'wgpu'
        run: cargo bench --features wgpu --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          override: true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build documentation
        run: cargo doc --no-deps --features metal-native

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc
