[package]
name = "hive-gpu"
version = "0.2.0"
edition = "2024"
authors = ["HiveLLM Contributors"]
license = "Apache-2.0"
description = "High-performance GPU acceleration for vector operations with Device Info API (Metal, CUDA, ROCm)"
repository = "https://github.com/hivellm/hive-gpu"
keywords = ["gpu", "vector-search", "hnsw", "metal", "cuda"]
categories = ["hardware-support", "algorithms"]
readme = "README.md"
documentation = "https://docs.rs/hive-gpu"
homepage = "https://github.com/hivellm/hive-gpu"

[workspace]

[dependencies]
# Core dependencies
log = "0.4"
thiserror = "1.0"
bytemuck = { version = "1.14", features = ["derive"] }
half = { version = "1.8", features = ["serde"] } # For f16 support
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }

# Optional GPU backends
[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
cudarc = { version = "0.13", features = ["driver", "cublas", "cuda-12040", "dynamic-linking"], optional = true, default-features = false }
# Intel / Vulkan Compute backend — ash loads the Vulkan loader dynamically
# at runtime so the crate builds on hosts without the Vulkan SDK installed.
ash = { version = "0.38", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = { version = "0.8", optional = true }

# naga compiles the intel backend's WGSL compute shaders into SPIR-V at
# build time. Pure-Rust dep — no CMake / C++ toolchain required.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.build-dependencies]
naga = { version = "23", features = ["wgsl-in", "spv-out"], optional = true }

[features]
default = ["metal-native"]
# Pure Metal Native implementation with objc2
metal-native = ["objc2-metal", "objc2-foundation", "objc2"]
# CUDA native implementation using cudarc (driver API + cuBLAS)
cuda = ["dep:cudarc"]
# ROCm / HIP native implementation. Dynamic-link libamdhip64 / librocblas at
# runtime via libloading so cargo build works on hosts without ROCm.
rocm = ["dep:libloading"]
# Intel GPU backend via Vulkan Compute (also runs on any Vulkan device in
# fallback mode). Requires the Vulkan driver at runtime; WGSL shaders are
# compiled to SPIR-V at build time via naga (build-dep only, pure-Rust).
intel = ["dep:ash", "dep:naga"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"
tokio = { version = "1.40", features = ["full"] }

[[bench]]
name = "gpu_operations"
harness = false
required-features = ["metal-native"]

[[bench]]
name = "cuda_ops"
harness = false
required-features = ["cuda"]

[[bench]]
name = "cuda_ivf"
harness = false
required-features = ["cuda"]

[[example]]
name = "metal_basic"
required-features = ["metal-native"]

[[example]]
name = "cuda_basic"
required-features = ["cuda"]
